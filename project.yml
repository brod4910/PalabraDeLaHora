# Optional: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`).
# The checked-in PalabraDeLaHora.xcodeproj already works; this is only a fallback.
name: PalabraDeLaHora
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PALABRA_BUNDLE_ID: com.example.palabra
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  PalabraDeLaHora:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
      - Shared
    dependencies:
      - target: PalabraWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PALABRA_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Palabra
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: App/PalabraDeLaHora.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  PalabraWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: ["Info.plist", "*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PALABRA_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Palabra Widget
        CODE_SIGN_ENTITLEMENTS: Widget/PalabraWidgetExtension.entitlements
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
